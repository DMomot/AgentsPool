name: Test and Deploy

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours to monitor production

jobs:
  test-before-merge:
    name: Test Before Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install pytest pytest-asyncio requests
    
    - name: Run API tests against current production
      env:
        API_BASE_URL: https://agentspool.ai
      run: |
        cd backend
        pytest test_api.py -v --tb=short
      continue-on-error: false
    
    - name: Tests passed
      run: |
        echo "✅ All tests passed! Safe to merge and deploy."
  
  monitor-production:
    name: Monitor Production
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install pytest pytest-asyncio requests
    
    - name: Run API tests against production
      env:
        API_BASE_URL: https://agentspool.ai
      run: |
        cd backend
        pytest test_api.py -v --tb=short
      continue-on-error: false
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::Production API tests failed! Check the logs above."
        exit 1

