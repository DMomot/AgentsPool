name: Test Production API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours to monitor production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install pytest pytest-asyncio requests
    
    - name: Run API tests
      env:
        API_BASE_URL: https://agentspool.ai
      run: |
        cd backend
        pytest test_api.py -v --tb=short
      continue-on-error: false
    
    - name: Tests passed
      run: |
        echo "✅ All tests passed!"

