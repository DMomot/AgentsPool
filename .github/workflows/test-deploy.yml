name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test New Code Against Production DB
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install fastapi uvicorn sqlalchemy psycopg2-binary pydantic pydantic-settings pytest pytest-asyncio requests python-dotenv beautifulsoup4
    
    - name: Start backend server with production DB
      env:
        DATABASE_URL: postgresql://postgres:5gkWK_2~_enBlRC1o6Ci2ZUxMz_Th3Jb@yamanote.proxy.rlwy.net:25914/railway
        PORT: 8000
      run: |
        cd backend
        python main.py &
        BACKEND_PID=$!
        echo "Backend PID: $BACKEND_PID"
        sleep 10
        echo "✅ Backend started"
    
    - name: Run API tests
      env:
        API_BASE_URL: http://localhost:8000
      run: |
        cd backend
        pytest test_api.py -v --tb=short
    
    - name: Tests passed
      run: |
        echo "✅ All tests passed! New code is ready to deploy."
