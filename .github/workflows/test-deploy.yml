name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test New Code Against Production DB
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Start backend server and run tests
      env:
        DATABASE_URL: postgresql://postgres:5gkWK_2~_enBlRC1o6Ci2ZUxMz_Th3Jb@yamanote.proxy.rlwy.net:25914/railway
        PORT: 8000
        API_BASE_URL: http://localhost:8000
      run: |
        cd backend
        python main.py &
        BACKEND_PID=$!
        echo "Backend PID: $BACKEND_PID"
        echo "Waiting for server to start (loading AI models)..."
        
        # Wait for server with retries (up to 180 seconds for AI model loading)
        for i in {1..36}; do
          sleep 5
          if curl -s http://localhost:8000/status > /dev/null; then
            echo "✅ Backend started successfully after $(($i * 5)) seconds"
            break
          fi
          echo "Waiting for AI models to load... ($(($i * 5))s / 180s)"
          if [ $i -eq 36 ]; then
            echo "❌ Server failed to start after 180 seconds"
            kill $BACKEND_PID
            exit 1
          fi
        done
        
        pytest test_api.py -v --tb=short
        TEST_RESULT=$?
        kill $BACKEND_PID
        exit $TEST_RESULT
    
    - name: Tests passed
      run: |
        echo "✅ All tests passed! New code is ready to deploy."
