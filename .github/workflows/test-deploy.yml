name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test New Code Against Production DB
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Start backend server and run tests
      env:
        DATABASE_URL: postgresql://postgres:5gkWK_2~_enBlRC1o6Ci2ZUxMz_Th3Jb@yamanote.proxy.rlwy.net:25914/railway
        PORT: 8000
        API_BASE_URL: http://localhost:8000
      run: |
        cd backend
        python main.py &
        BACKEND_PID=$!
        echo "Backend PID: $BACKEND_PID"
        echo "Waiting for server to start..."
        sleep 15
        curl -s http://localhost:8000/status || (echo "❌ Server not responding" && kill $BACKEND_PID && exit 1)
        echo "✅ Backend started successfully"
        pytest test_api.py -v --tb=short
        TEST_RESULT=$?
        kill $BACKEND_PID
        exit $TEST_RESULT
    
    - name: Tests passed
      run: |
        echo "✅ All tests passed! New code is ready to deploy."
