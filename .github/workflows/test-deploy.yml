name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours to monitor production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install pytest pytest-asyncio requests
    
    - name: Run API tests
      env:
        API_BASE_URL: https://agentspool.ai
      run: |
        cd backend
        pytest test_api.py -v --tb=short
      continue-on-error: false
    
    - name: Tests passed
      run: |
        echo "✅ All tests passed!"
  
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install Railway CLI
      run: |
        curl -fsSL https://railway.app/install.sh | sh
    
    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        railway up --service backend
        echo "🚀 Deployment triggered on Railway!"
    
    - name: Wait for deployment
      run: |
        echo "⏳ Waiting 60 seconds for deployment to complete..."
        sleep 60
    
    - name: Verify deployment
      run: |
        echo "✅ Deployment complete! Check Railway dashboard for status."
  
  monitor-production:
    name: Monitor Production
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install pytest pytest-asyncio requests
    
    - name: Run API tests against production
      env:
        API_BASE_URL: https://agentspool.ai
      run: |
        cd backend
        pytest test_api.py -v --tb=short
      continue-on-error: false
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::Production API tests failed! Check the logs above."
        exit 1

