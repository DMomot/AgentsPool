[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python main.py"
healthcheckPath = "/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# HuggingFace models cache (all-MiniLM-L6-v2)
[[deploy.volumes]]
mountPath = "/app/.cache"
name = "model-cache"

# Pip/PyTorch cache (reuse between deployments)
[[deploy.volumes]]
mountPath = "/root/.cache/pip"
name = "pip-cache"
