[pytest]
# Pytest configuration
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    integration: Integration tests
    slow: Slow running tests
    
# Environment variables defaults
env =
    API_BASE_URL=https://agentspool.ai

